name: Build & Release Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish, for example v1.0.0'
        required: true
        type: string

jobs:
  build-macos:
    name: Build macOS App Bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import-check source modules
        run: |
          python -m py_compile main.py mcp_server.py capture_overlay.py action_hub.py config.py main_window.py parser_engine.py screen_glow.py ocr/base.py ocr/rapidocr_backend.py ocr/tables.py ocr/tesseract.py scripts/smoke_mcp_stdio.py
          python -c "import main, mcp_server; print('imports ok')"

      - name: Build macOS .app bundle
        run: |
          pyinstaller Snippy-macOS.spec --noconfirm

      - name: Smoke-test packaged MCP stdio
        run: |
          python scripts/smoke_mcp_stdio.py "$PWD/dist/Snippy.app/Contents/MacOS/Snippy" --mcp-stdio

      - name: Create ZIP archive for macOS
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Snippy.app "Snippy-macOS-${{ matrix.arch }}.zip"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snippy-macOS-${{ matrix.arch }}
          path: dist/Snippy-macOS-${{ matrix.arch }}.zip

  build-windows:
    name: Build Windows Executable (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Import-check source modules
        run: |
          python -m py_compile main.py mcp_server.py capture_overlay.py action_hub.py config.py main_window.py parser_engine.py screen_glow.py ocr\base.py ocr\rapidocr_backend.py ocr\tables.py ocr\tesseract.py scripts\smoke_mcp_stdio.py
          python -c "import main, mcp_server; print('imports ok')"

      - name: Build Windows executable
        run: |
          pyinstaller Snippy.spec --noconfirm

      - name: Smoke-test packaged MCP stdio
        run: |
          $exe = Join-Path $PWD "dist\Snippy.exe"
          python scripts\smoke_mcp_stdio.py $exe --mcp-stdio

      - name: Rename Windows release artifact
        run: |
          Move-Item -LiteralPath dist\Snippy.exe -Destination dist\Snippy-Windows-x64.exe -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snippy-Windows-x64
          path: dist/Snippy-Windows-x64.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: Snippy-macOS-x64

      - name: Download macOS arm64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: Snippy-macOS-arm64

      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: Snippy-Windows-x64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            Snippy-macOS-x64.zip
            Snippy-macOS-arm64.zip
            Snippy-Windows-x64.exe
          name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          draft: false
          prerelease: false
